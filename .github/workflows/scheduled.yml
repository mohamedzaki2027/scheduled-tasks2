name: Daily Script

on:
  schedule:
    # ╔═══════════════════════════════════════════════════════════════╗
    # ║  CHANGE THE LINE BELOW to set when your script runs          ║
    # ║                                                                ║
    # ║  Format:  'MINUTE HOUR * * *'                                  ║
    # ║                                                                ║
    # ║  Examples:                                                     ║
    # ║    '0 9 * * *'   = 9:00 AM UTC daily                          ║
    # ║    '30 14 * * *' = 2:30 PM UTC daily                          ║
    # ║    '0 0 * * *'   = Midnight UTC daily                         ║
    # ║                                                                ║
    # ║  Use https://time.is/UTC to find your local time in UTC       ║
    # ╚═══════════════════════════════════════════════════════════════╝
    - cron: "2 11 * * *"

  # This adds a "Run workflow" button so you can test manually
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          # Your secrets are available as environment variables
          # Add more secrets in Settings > Secrets > Actions
          INFOBIP_SMS_ENDPOINT_URL: ${{ secrets.INFOBIP_SMS_ENDPOINT_URL }}
          INFOBIP_API_KEY: ${{ secrets.INFOBIP_API_KEY }}
          I_RECEIVER_MOBILE: ${{ secrets.I_RECEIVER_MOBILE }}
          I_SENDER_MOBILE: ${{ secrets.I_SENDER_MOBILE }}
          ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          T_RECEIVER_MOBILE: ${{ secrets.T_RECEIVER_MOBILE }}
          T_SENDER_MOBILE: ${{ secrets.T_SENDER_MOBILE }}
        run: python main.py
